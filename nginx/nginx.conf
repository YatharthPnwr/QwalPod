events {}

http {

    # --------------------------------------------------
    # WebSocket upgrade handling
    # --------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --------------------------------------------------
    # RATE LIMITING ZONES
    # --------------------------------------------------

    # General site traffic (pages, assets)
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    # API traffic (stricter)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Auth / sensitive endpoints (very strict)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

    # --------------------------------------------------
    # HTTP SERVER (Certbot + temporary app access)
    # --------------------------------------------------
    server {
        listen 80;
        server_name qwalpod.live www.qwalpod.live;

        # ACME challenge (NEVER rate-limit this)
        location /.well-known/acme-challenge/ {
            root /var/www/html;
            limit_req off;
        }

        # -------------------------
        # Main app
        # -------------------------
        location / {
            limit_req zone=general burst=60 nodelay;

            proxy_pass http://127.0.0.1:3000;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        # -------------------------
        # API endpoints
        # -------------------------
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
        }

        # -------------------------
        # Auth endpoints (login, otp, etc.)
        # -------------------------
        location ~ ^/(login|signup|auth|api/auth) {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
        }
    }
}
