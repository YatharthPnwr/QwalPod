# Redirect www to non-www (HTTPS)
server {
    listen 443 ssl;
    server_name www.qwalpod.live;

    ssl_certificate /etc/letsencrypt/live/qwalpod.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qwalpod.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://qwalpod.live$request_uri;
}

server {
    server_name qwalpod.live ;

    # ----------------------------------
    # ACME challenge (Certbot)
    # ----------------------------------
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ----------------------------------
    # WebSocket endpoint (MUST come before /api/)
    # ----------------------------------
    location = /api/ws {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # ----------------------------------
    # Auth endpoints
    # ----------------------------------
    location ~ ^/(login|signup|auth|api/auth) {
        limit_req zone=auth burst=5 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ----------------------------------
    # API endpoints
    # ----------------------------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ----------------------------------
    # Main application
    # ----------------------------------
    location / {
        limit_req zone=general burst=60 nodelay;

        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/qwalpod.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qwalpod.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name qwalpod.live www.qwalpod.live;
    return 301 https://qwalpod.live$request_uri;
}